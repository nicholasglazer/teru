name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install deps
        run: sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxkbcommon-dev libwayland-dev
      - run: zig build test

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            flags: ""
          - name: linux-x86_64-x11
            flags: "-Dwayland=false"
          - name: linux-x86_64-wayland
            flags: "-Dx11=false"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install deps
        run: sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxkbcommon-dev libwayland-dev
      # Pin the CPU level: a bare `zig build` targets the runner's own CPU,
      # which varies run to run (AVX2, sometimes AVX-512), and the binary
      # then dies with SIGILL on machines without those extensions.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=x86_64_v2 ${{ matrix.flags }}
      - name: Check for AVX instructions
        run: |
          if objdump -d zig-out/bin/teru | grep -qE '%[yz]mm'; then
            echo "teru uses AVX registers; the -Dcpu pin did not apply" >&2
            exit 1
          fi
      - run: strip zig-out/bin/teru
      - uses: actions/upload-artifact@v4
        with:
          name: teru-${{ matrix.name }}
          path: zig-out/bin/teru

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build (cross-compile, Win32 + ConPTY; no X11/Wayland)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dx11=false -Dwayland=false
      - uses: actions/upload-artifact@v4
        with:
          name: teru-windows-x86_64
          path: zig-out/bin/teru.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Test
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v4
        with:
          name: teru-${{ matrix.name }}
          path: zig-out/bin/teru
