name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install deps
        run: sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxkbcommon-dev libwayland-dev
      - run: zig build test

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            flags: ""
          - name: linux-x86_64-x11
            flags: "-Dwayland=false"
          - name: linux-x86_64-wayland
            flags: "-Dx11=false"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install deps
        run: sudo apt-get install -y libxcb1-dev libxcb-shm0-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: zig build -Doptimize=ReleaseSafe ${{ matrix.flags }}
      - run: strip zig-out/bin/teru
      - uses: actions/upload-artifact@v4
        with:
          name: teru-${{ matrix.name }}
          path: zig-out/bin/teru

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build (cross-compile, Win32 + ConPTY; no X11/Wayland)
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dx11=false -Dwayland=false
      - uses: actions/upload-artifact@v4
        with:
          name: teru-windows-x86_64
          path: zig-out/bin/teru.exe

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Test
        run: zig build test
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      # A native build requires the runner's exact macOS version, point
      # release included (vtool shows it as minos). Also build for macOS 13
      # and later; kept apart until it has been seen to link.
      - name: Build for macOS 13 and later
        id: build-min
        continue-on-error: true
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos.13.0 \
            -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --prefix zig-out-macos13
          vtool -show-build zig-out-macos13/bin/teru
      - name: Build for Intel Macs (untested)
        continue-on-error: true
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos.13.0 \
            -Dmacos-sdk="$(xcrun --sdk macosx --show-sdk-path)" --prefix zig-out-x86_64
          vtool -show-build zig-out-x86_64/bin/teru
      # Runs teru in the runner's GUI session: fails if it crashes, exits
      # early or exits with an error; screenshots are uploaded either way.
      - name: Smoke test
        timeout-minutes: 8
        run: .github/scripts/macos-smoke.sh zig-out/bin/teru smoke
      # Uploaded whatever the smoke test said: a failing binary is the one
      # worth looking at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teru-${{ matrix.name }}-smoke
          path: smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teru-${{ matrix.name }}
          path: zig-out/bin/teru
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.build-min.outcome == 'success'
        with:
          name: teru-${{ matrix.name }}-macos13
          path: zig-out-macos13/bin/teru
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teru-macos-x86_64-untested-${{ matrix.runner }}
          path: zig-out-x86_64/bin/teru
          if-no-files-found: ignore
